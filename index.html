<<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Acordeón Hero</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1208;
  color: #f0e8d0;
  font-family: 'Georgia', serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
  touch-action: none;
}

h1 {
  margin-bottom: 2px;
  font-size: 20px;
  letter-spacing: 6px;
  color: #d4a843;
  font-weight: normal;
  text-transform: uppercase;
}

#sub {
  font-size: 11px;
  color: #7a6840;
  margin-bottom: 6px;
  letter-spacing: 2px;
  text-align: center;
}

#hud {
  display: flex;
  gap: 28px;
  margin-bottom: 10px;
  font-size: 14px;
  font-family: 'Courier New', monospace;
}
#hud span { color: #d4a843; }

/* ─── WRAP ─── */
#wrap {
  position: relative;
  width: 640px;
  max-width: 98vw;
}

/* ─── FEEDBACK FLOTANTE encima del acordeón ─── */
#feedbackArea {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-family: 'Georgia', serif;
  color: #d4a843;
  letter-spacing: 2px;
  min-height: 36px;
  transition: opacity 0.3s;
}

/* ─── CUERPO DEL ACORDEÓN ─── */
#accordion {
  position: relative;
  width: 100%;
  background: linear-gradient(160deg, #7a2e10 0%, #5c1e08 40%, #3d1205 100%);
  border-radius: 18px;
  border: 3px solid #8b4a1a;
  padding: 20px 16px 26px;
  box-shadow:
    inset 0 4px 16px rgba(0,0,0,0.5),
    inset 0 -2px 6px rgba(212,168,67,0.08),
    0 10px 30px rgba(0,0,0,0.7);
}

/* Rejilla fuelle */
#accordion::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.07) 0,rgba(0,0,0,0.07) 1px,transparent 1px,transparent 20px),
    repeating-linear-gradient(0deg,  rgba(0,0,0,0.07) 0,rgba(0,0,0,0.07) 1px,transparent 1px,transparent 20px);
  pointer-events: none;
}

#accLabel {
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  color: #8b6030;
  margin-bottom: 16px;
  text-transform: uppercase;
  position: relative;
  z-index: 2;
}

/* ─── FILAS ─── */
.btn-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 12px;
  position: relative;
  z-index: 2;
}
.btn-row.offset { transform: translateX(40px); }
.btn-row:last-child { margin-bottom: 0; }

/* ─── BOTÓN DE NOTA ─── */
.note-btn {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  cursor: pointer;
  border: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
  transition: transform 0.05s;
}

/* base oscura (profundidad) */
.note-btn .btn-base {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: inherit;
  filter: brightness(0.45);
  transform: translateY(3px);
}

/* cara del botón */
.note-btn .btn-face {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: inherit;
  filter: brightness(1.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: filter 0.05s, inset 0.05s;
}

.note-btn .label-key {
  font-family: 'Courier New', monospace;
  font-size: 18px;
  font-weight: bold;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  line-height: 1;
}
.note-btn .label-note {
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.5);
  line-height: 1;
}

/* anillo de glow (iluminación progresiva) */
.note-btn .glow-ring {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 3px solid transparent;
  pointer-events: none;
  transition: border-color 0.08s, box-shadow 0.08s;
}

/* disponible */
.note-btn.available {
  box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}

/* inactivo */
.note-btn.unavailable {
  opacity: 0.22;
  filter: saturate(0.15);
  cursor: not-allowed;
}

/* presionado */
.note-btn.pressed { transform: translateY(2px); }
.note-btn.pressed .btn-face { inset: 8px; filter: brightness(1.5); }
.note-btn.pressed .btn-base { filter: brightness(0.3); transform: translateY(1px); }

/* ─── OVERLAY ─── */
#overlay {
  position: absolute;
  inset: -50px -10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,7,3,0.93);
  border-radius: 18px;
  backdrop-filter: blur(8px);
  z-index: 20;
}
.screen { display:none; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:0 24px; }
.screen.active { display:flex; }

.menuBtn {
  background:transparent; color:#f0e8d0;
  border:1px solid #6b4f22; padding:13px 28px; font-size:16px;
  border-radius:4px; cursor:pointer; min-width:220px;
  font-family:'Georgia',serif; letter-spacing:1px; transition:border-color 0.15s,background 0.15s;
}
.menuBtn:hover { border-color:#d4a843; background:rgba(212,168,67,0.08); }

.songBtn {
  background:transparent; color:#f0e8d0; border:1px solid #3a2c15;
  padding:10px 20px; font-size:14px; border-radius:4px; cursor:pointer;
  min-width:240px; text-align:left; font-family:'Georgia',serif;
  transition:border-color 0.15s,background 0.15s;
}
.songBtn:hover { border-color:#d4a843; background:rgba(212,168,67,0.07); }
.songBtn .meta { color:#7a6840; font-size:11px; display:block; margin-top:3px; font-family:'Courier New',monospace; }

.diffBtn {
  background:transparent; color:#a08050; border:1px solid #3a2c15;
  padding:6px 14px; font-size:12px; border-radius:20px; cursor:pointer;
  transition:all 0.15s; font-family:'Courier New',monospace;
}
.diffBtn:hover { border-color:#d4a843; color:#f0e8d0; }
.diffBtn.active { background:#d4a843; color:#1a1208; border-color:#d4a843; font-weight:bold; }

.bpmBtn {
  background:transparent; color:#f0e8d0; border:1px solid #3a2c15;
  width:28px; height:28px; font-size:16px; border-radius:50%; cursor:pointer;
  line-height:1; transition:border-color 0.15s;
}
.bpmBtn:hover { border-color:#d4a843; }

.backBtn {
  background:transparent; color:#5a4820; border:none;
  font-size:12px; cursor:pointer; text-decoration:underline;
  margin-top:2px; font-family:'Georgia',serif;
}
.backBtn:hover { color:#a08050; }

.startBtn {
  background:#d4a843; color:#1a1208; border:none;
  padding:13px 32px; font-size:17px; font-weight:bold;
  border-radius:4px; cursor:pointer; letter-spacing:2px;
  margin-top:4px; font-family:'Georgia',serif; transition:background 0.15s;
}
.startBtn:hover { background:#e8c060; }
.startBtn:disabled { background:#3a2c15; color:#5a4820; cursor:not-allowed; }

#modeTag {
  display:inline-block; border:1px solid #3a2c15; color:#7a6840;
  font-size:11px; padding:2px 10px; border-radius:20px;
  letter-spacing:2px; margin-left:6px; font-family:'Courier New',monospace;
}
#modeTag.song { border-color:#d4a843; color:#d4a843; }

.tip { color:#5a4820; font-size:12px; max-width:320px; line-height:1.7; font-family:'Courier New',monospace; }

#inGameMenuBtn {
  display:none; position:absolute; top:-44px; right:0; z-index:5;
  background:rgba(26,18,8,0.8); color:#7a6840; border:1px solid #3a2c15;
  padding:5px 12px; font-size:12px; border-radius:20px; cursor:pointer;
}
#inGameMenuBtn:hover { border-color:#d4a843; color:#d4a843; }
</style>
</head>
<body>

<h1>Acordeón Hero</h1>
<div id="sub">Fa mayor &nbsp;·&nbsp; <span id="modeTag">LIBRE</span></div>
<div id="hud">
  <div>Pts <span id="score">0</span></div>
  <div>×<span id="comboVal">0</span></div>
  <div><span id="acc">100</span>%</div>
</div>

<div id="wrap">
  <div id="feedbackArea">&nbsp;</div>

  <div id="accordion">
    <div id="accLabel">Acordeón diatónico · Fa mayor</div>

    <!-- Fila A (offset, hilera interna): Sib4  Re  Fa  La -->
    <div class="btn-row offset">
      <button class="note-btn available" data-lane="0" data-key="A" style="background:#6b3d9e">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">A</span><span class="label-note">Sib₄</span></div>
        <div class="glow-ring" id="glow-0"></div>
      </button>
      <button class="note-btn available" data-lane="2" data-key="D" style="background:#a05010">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">D</span><span class="label-note">Re</span></div>
        <div class="glow-ring" id="glow-2"></div>
      </button>
      <button class="note-btn available" data-lane="4" data-key="G" style="background:#1e7a58">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">G</span><span class="label-note">Fa</span></div>
        <div class="glow-ring" id="glow-4"></div>
      </button>
      <button class="note-btn available" data-lane="6" data-key="J" style="background:#3848a8">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">J</span><span class="label-note">La</span></div>
        <div class="glow-ring" id="glow-6"></div>
      </button>
    </div>

    <!-- Fila B (hilera externa): Do  Mib  Sol  Sib5 -->
    <div class="btn-row">
      <button class="note-btn available" data-lane="1" data-key="S" style="background:#a82828">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">S</span><span class="label-note">Do</span></div>
        <div class="glow-ring" id="glow-1"></div>
      </button>
      <button class="note-btn available" data-lane="3" data-key="F" style="background:#8a6800">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">F</span><span class="label-note">Mib</span></div>
        <div class="glow-ring" id="glow-3"></div>
      </button>
      <button class="note-btn available" data-lane="5" data-key="H" style="background:#1a5a9a">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">H</span><span class="label-note">Sol</span></div>
        <div class="glow-ring" id="glow-5"></div>
      </button>
      <button class="note-btn available" data-lane="7" data-key="K" style="background:#7030a0">
        <div class="btn-base"></div>
        <div class="btn-face"><span class="label-key">K</span><span class="label-note">Sib₅</span></div>
        <div class="glow-ring" id="glow-7"></div>
      </button>
    </div>
  </div>

  <button id="inGameMenuBtn">☰ Menú</button>

  <div id="overlay">
    <div id="screenMenu" class="screen active">
      <div style="font-size:14px;letter-spacing:4px;color:#d4a843;margin-bottom:4px;">ACORDEÓN HERO</div>
      <p class="tip" style="margin-bottom:8px;">Toca cada nota cuando su botón se ilumine completamente</p>
      <button class="menuBtn" id="btnFree">🎹 Modo libre</button>
      <button class="menuBtn" id="btnSongs">🎵 Modo canción</button>
    </div>

    <div id="screenSongs" class="screen">
      <div style="font-size:13px;letter-spacing:3px;color:#d4a843;margin-bottom:8px;">CANCIONES</div>
      <div id="songList" style="display:flex;flex-direction:column;align-items:center;gap:6px;max-height:260px;overflow-y:auto;padding:2px 6px;"></div>
      <button class="backBtn" id="backFromSongs">← volver</button>
    </div>

    <div id="screenPlay" class="screen">
      <div id="playTitle" style="font-size:15px;letter-spacing:2px;color:#d4a843;"></div>
      <p id="playMeta" class="tip"></p>
      <p class="tip" style="color:#3a2c15;">A=Sib₄ · S=Do · D=Re · F=Mib · G=Fa · H=Sol · J=La · K=Sib₅</p>
      <div id="difficultyRow" style="display:flex;gap:8px;margin-top:4px;">
        <button class="diffBtn" data-diff="facil">Fácil</button>
        <button class="diffBtn" data-diff="medio">Medio</button>
        <button class="diffBtn" data-diff="dificil">Difícil</button>
      </div>
      <div id="bpmRow" style="display:flex;align-items:center;gap:10px;margin-top:8px;">
        <button class="bpmBtn" id="bpmDown">−</button>
        <span class="tip" style="color:#a08050;min-width:100px;">Tempo: <b id="bpmValue">108</b></span>
        <button class="bpmBtn" id="bpmUp">+</button>
        <button class="backBtn" id="bpmReset" style="margin:0 0 0 4px;">reset</button>
      </div>
      <button class="startBtn" id="startBtn">Cargando…</button>
      <button class="backBtn" id="backFromPlay">← volver</button>
    </div>

    <div id="screenEnd" class="screen">
      <div style="font-size:14px;letter-spacing:3px;color:#d4a843;">TERMINADO</div>
      <p id="endScore" style="font-size:22px;margin:8px 0;font-family:'Courier New',monospace;"></p>
      <p id="endAcc" style="color:#7a6840;font-family:'Courier New',monospace;font-size:12px;"></p>
      <button class="menuBtn" id="btnPlayAgain" style="margin-top:10px;">Repetir</button>
      <button class="backBtn" id="backFromEnd">← canciones</button>
      <button class="backBtn" id="backToMenuFromEnd">← menú</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CONFIGURACIÓN
══════════════════════════════════════════ */
const LANES       = ['A','S','D','F','G','H','J','K'];
const NOTE_NAMES  = ['Sib₄','Do','Re','Mib','Fa','Sol','La','Sib₅'];
const SAMPLE_NOTE = ['Bb','C','D','Eb','F','G','A','Bb5'];
const LANE_COLORS = ['#9b5fd0','#e05040','#d4831a','#c0a020','#30b878','#3090e0','#6070e0','#b050d8'];
const FPS = 60;
const E=0.5, Q=1, H2=2, W4=4;

const DIFFICULTY = {
  facil:   { windowMs: 600, anticipoMs: 2200 },
  medio:   { windowMs: 350, anticipoMs: 1600 },
  dificil: { windowMs: 200, anticipoMs: 1100 }
};
let difficulty = 'medio';
let bpmOverride = null;
const BPM_MIN=40, BPM_MAX=220, BPM_STEP=5;
function effectiveBpm(){ return bpmOverride!==null ? bpmOverride : currentSong.bpm; }
function beatMs(){ return 60000 / effectiveBpm(); }

/* ══════════════════════════════════════════
   CANCIONES
   [lane, beats, octaveUp?, staccato?]  — lane -1 = silencio
   Escala Fa mayor: 0=Sib4 1=Do 2=Re 3=Mib 4=Fa 5=Sol 6=La 7=Sib5
══════════════════════════════════════════ */
const SONGS = [
  {
    id:'cucaracha', title:'La Cucaracha', bpm:108,
    notes:[
      [1,E],[1,E],[1,E],[4,E],[6,Q],
      [1,E],[1,E],[1,E],[4,E],[6,Q],[-1,E],
      [4,E],[4,E],[3,E],[3,E],[2,E],[2,E],[1,Q],[-1,E],
      [1,E],[1,E],[1,E],[3,E],[5,E],
      [1,E],[1,E],[1,E],[3,E],[5,E],[-1,E],
      [1,Q,true],[2,Q,true],[1,Q,true],[0,Q],[6,Q],[5,E],[4,H2],[-1,H2],
      [1,E],[1,E],[4,E],[4,E],[6,E],[6,E],[1,E,true],[6,Q],[-1,E],
      [1,E,true],[2,E,true],[1,E,true],[0,E],[6,E],[1,E,true],[0,E],[5,E],[-1,E],
      [1,E],[1,E],[3,E],[3,E],[5,E],[5,E],[0,E],[5,E],[-1,E],
      [1,Q,true],[2,Q,true],[1,Q,true],[0,Q],[6,Q],[5,E],[4,H2],[-1,H2],
      [1,E],[1,E],[1,E],[4,E],[6,Q],
      [1,E],[1,E],[1,E],[4,E],[6,Q],[-1,E],
      [4,E],[4,E],[3,E],[3,E],[2,E],[2,E],[1,Q],[-1,E],
      [1,E],[1,E],[1,E],[3,E],[5,E],
      [1,E],[1,E],[1,E],[3,E],[5,E],[-1,E],
      [1,Q,true],[2,Q,true],[1,Q,true],[0,Q],[6,Q],[5,E],[4,Q],[-1,E],
      [7,W4],[-1,H2]
    ]
  },
  {
    id:'fuertenosoy', title:'Fuerte No Soy (Puente)', bpm:100,
    notes:[
      [1,E],[-1,E],
      [1,E],[2,E],[3,E],[4,E],[3,E],[2,E],[3,E],[0,E],[-1,E],
      [0,E],[1,E],[2,E],[3,E],[2,E],[1,E],[2,E],[4,E],[-1,E],
      [4,E],[5,E],[6,E],[5,E],[4,E],[3,E],[4,E],[-1,E],
      [0,E],[0,E],[0,E],[1,E],[2,E],[-1,E],
      [2,E],[2,E],[2,E],[3,E],[4,E],[-1,H2],
      [1,E],[-1,E],
      [1,E],[2,E],[3,E],[4,E],[3,E],[2,E],[3,E],[0,E],[-1,E],
      [0,E],[1,E],[2,E],[3,E],[2,E],[1,E],[2,E],[4,E],[-1,E],
      [4,E],[5,E],[6,E],[5,E],[4,E],[3,E],[4,E],[-1,E],
      [0,E],[0,E],[0,E],[1,E],[2,E],[-1,E],
      [2,E],[2,E],[2,E],[3,E],[4,E],[-1,H2]
    ]
  }
];

/* ══════════════════════════════════════════
   AUDIO
══════════════════════════════════════════ */
let audioCtx = null;
const audioBuffers = NOTE_NAMES.map(()=>null);
const activeSrcs   = NOTE_NAMES.map(()=>null);

function synth(laneIdx, miss, rate) {
  if (!audioCtx) return;
  const freqs=[233.08,261.63,293.66,311.13,349.23,392.00,440.00,466.16];
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type='triangle';
  osc.frequency.value=freqs[laneIdx]*(rate||1)*(miss?0.5:1);
  gain.gain.setValueAtTime(miss?0.15:0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+(miss?0.12:0.4));
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.5);
}
function initAudio(){
  if (audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  if (audioCtx.state==='suspended') audioCtx.resume();
}
async function preloadSamples(){
  initAudio();
  await Promise.all(SAMPLE_NOTE.map(async(name,i)=>{
    try {
      const res=await fetch(`sounds/${name}.wav`);
      if (!res.ok) throw 0;
      audioBuffers[i]=await audioCtx.decodeAudioData(await res.arrayBuffer());
    } catch {}
  }));
  enableStart();
}
function enableStart(){
  const btn=document.getElementById('startBtn');
  btn.disabled=false; btn.textContent='Empezar';
}
function playNote(laneIdx, miss, octaveUp){
  if (!audioCtx) initAudio();
  if (audioCtx.state==='suspended') audioCtx.resume();
  stopNote(laneIdx);
  const rate=(octaveUp?2:1)*(miss?0.75:1);
  if (audioBuffers[laneIdx]){
    const src=audioCtx.createBufferSource(), gain=audioCtx.createGain();
    src.buffer=audioBuffers[laneIdx]; src.loop=true;
    gain.gain.value=miss?0.3:1; src.playbackRate.value=rate;
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start(0); activeSrcs[laneIdx]={src,gain};
  } else { synth(laneIdx,miss,octaveUp?2:1); }
}
function stopNote(laneIdx){
  const a=activeSrcs[laneIdx]; if(!a) return;
  const now=audioCtx.currentTime;
  a.gain.gain.cancelScheduledValues(now);
  a.gain.gain.setValueAtTime(a.gain.gain.value,now);
  a.gain.gain.linearRampToValueAtTime(0,now+0.03);
  a.src.stop(now+0.04); activeSrcs[laneIdx]=null;
}
function stopAllSounds(){ activeSrcs.forEach((_,i)=>stopNote(i)); }
window.addEventListener('pointerdown',()=>{ if(audioCtx) audioCtx.resume(); });

/* ══════════════════════════════════════════
   ESTADO
══════════════════════════════════════════ */
let mode='free', currentSong=SONGS[0], running=false;
let score=0, combo=0, hits=0, misses=0, total=0;
let songNoteIdx=0, songDone=false;

// Cola de notas programadas: { lane, hitTime (ms absoluto), octaveUp, staccato, armed, fired }
// hitTime = momento exacto en que debe tocarse
// armed   = ya entró en ventana de anticipación (botón empieza a brillar)
// fired   = ya fue tocada o perdida
let queue = [];
let songStartTime = 0; // performance.now() cuando empezó la canción

const keyDown={A:false,S:false,D:false,F:false,G:false,H:false,J:false,K:false};

/* ══════════════════════════════════════════
   BOTONES DOM
══════════════════════════════════════════ */
const domBtns = {};
document.querySelectorAll('.note-btn').forEach(btn=>{
  const lane=parseInt(btn.dataset.lane);
  const key =btn.dataset.key;
  domBtns[lane]=btn;

  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
    if (btn.classList.contains('unavailable')) return;
    keyDown[key]=true; btn.classList.add('pressed');
    tryHit(lane);
  });
  const release=()=>{
    keyDown[key]=false; btn.classList.remove('pressed');
    stopNote(lane);
  };
  btn.addEventListener('pointerup',release);
  btn.addEventListener('pointerleave',release);
  btn.addEventListener('pointercancel',release);
});

/* ══════════════════════════════════════════
   CONSTRUIR COLA DE NOTAS
   Convierte la partitura en timestamps absolutos
══════════════════════════════════════════ */
function buildQueue(){
  queue=[];
  let t=0; // tiempo en ms desde el inicio
  const bm=beatMs();
  currentSong.notes.forEach(([lane,beats,octaveUp,staccato])=>{
    const dur=beats*bm;
    if (lane>=0){
      queue.push({
        lane, octaveUp:!!octaveUp, staccato:!!staccato,
        hitTime: t + dur*0.5, // el golpe ideal es a la mitad del valor de la nota
        duration: dur,
        armed:false, fired:false, hit:false
      });
    }
    t+=dur;
  });
  return t; // duración total en ms
}

/* ══════════════════════════════════════════
   ILUMINACIÓN PROGRESIVA
   Cada botón brilla de 0→100% durante el periodo de "antipo"
   (DIFFICULTY.anticipoMs antes del hitTime)
══════════════════════════════════════════ */
function updateGlows(){
  const now=performance.now()-songStartTime;
  const antMs=DIFFICULTY[difficulty].anticipoMs;

  // Para cada carril, encontrar la nota activa más próxima sin disparar
  const nextForLane=new Array(8).fill(null);
  queue.forEach(n=>{
    if (n.fired) return;
    if (nextForLane[n.lane]===null || n.hitTime < nextForLane[n.lane].hitTime)
      nextForLane[n.lane]=n;
  });

  for (let i=0;i<8;i++){
    const ring=document.getElementById(`glow-${i}`);
    if (!ring) continue;
    const n=nextForLane[i];
    if (!n){
      ring.style.borderColor='transparent';
      ring.style.boxShadow='none';
      continue;
    }
    const msLeft=n.hitTime-now;
    if (msLeft>antMs || msLeft<-DIFFICULTY[difficulty].windowMs){
      ring.style.borderColor='transparent';
      ring.style.boxShadow='none';
      continue;
    }
    // progress: 0 cuando empieza a brillar, 1 cuando llega el momento exacto
    const progress=Math.max(0,Math.min(1, 1 - msLeft/antMs));
    const col=LANE_COLORS[i];
    // pulso extra cuando está muy cerca (últimos 15%)
    const pulse = progress>0.85 ? 0.7+0.3*Math.sin(Date.now()*0.025) : 1;
    const alpha=Math.round(progress*255*pulse).toString(16).padStart(2,'0');
    const blur=Math.round(progress*24*pulse);
    ring.style.borderColor=col+alpha;
    ring.style.boxShadow=`0 0 ${blur}px ${col}, 0 0 ${blur*2}px ${col}55`;
  }
}

/* ══════════════════════════════════════════
   HIT
══════════════════════════════════════════ */
function tryHit(laneIdx){
  if (!running) return;
  if (mode==='free'){
    playNote(laneIdx,false);
    flashFeedback('♪','#d4a843');
    return;
  }
  const now=performance.now()-songStartTime;
  const win=DIFFICULTY[difficulty].windowMs;

  // Buscar nota más cercana en ese carril dentro de la ventana
  let best=null, bestDist=Infinity;
  queue.forEach(n=>{
    if (n.fired||n.lane!==laneIdx) return;
    const d=Math.abs(n.hitTime-now);
    if (d<win && d<bestDist){ bestDist=d; best=n; }
  });

  if (best){
    best.fired=true; best.hit=true;
    hits++; total++; combo++;
    const perfect=bestDist<win*0.3;
    score+=(perfect?100:50)+Math.min(combo*2,60);
    playNote(laneIdx,false,best.octaveUp);
    flashFeedback(perfect?'✦ PERFECT':'✓ BIEN', perfect?'#d4a843':'#70c870');
    if(best.staccato) setTimeout(()=>stopNote(laneIdx),140);
  } else {
    // ¿había una nota que ya pasó sin tocar en este carril?
    combo=0;
    playNote(laneIdx,true);
    flashFeedback('✗','#b04030');
    misses++; total++;
  }
  updateHUD();
}

/* ══════════════════════════════════════════
   FEEDBACK
══════════════════════════════════════════ */
let feedbackTimer=null;
function flashFeedback(text, color){
  const el=document.getElementById('feedbackArea');
  el.textContent=text; el.style.color=color; el.style.opacity='1';
  clearTimeout(feedbackTimer);
  feedbackTimer=setTimeout(()=>{ el.style.opacity='0'; },600);
}

/* ══════════════════════════════════════════
   UPDATE — comprueba notas perdidas y fin de canción
══════════════════════════════════════════ */
function update(){
  if (!running) return;
  if (mode==='song'){
    const now=performance.now()-songStartTime;
    const win=DIFFICULTY[difficulty].windowMs;
    let allFired=true;
    queue.forEach(n=>{
      if (n.fired) return;
      allFired=false;
      // nota perdida: pasó la ventana sin tocar
      if (now > n.hitTime+win){
        n.fired=true; n.hit=false;
        combo=0; misses++; total++;
        updateHUD();
        flashFeedback('✗','#804020');
      }
    });
    if (allFired && !songDone){
      songDone=true;
      setTimeout(endGame,800);
    }
    updateGlows();
  }
}

/* ══════════════════════════════════════════
   NAVEGACIÓN
══════════════════════════════════════════ */
const SCREENS=['screenMenu','screenSongs','screenPlay','screenEnd'];
function showScreen(id){ SCREENS.forEach(s=>document.getElementById(s).classList.toggle('active',s===id)); }
function goToMenu(){
  running=false; stopAllSounds(); songDone=false;
  document.getElementById('inGameMenuBtn').style.display='none';
  document.getElementById('overlay').style.display='flex';
  // apagar todos los glows
  for(let i=0;i<8;i++){
    const r=document.getElementById(`glow-${i}`);
    if(r){r.style.borderColor='transparent';r.style.boxShadow='none';}
  }
  showScreen('screenMenu');
}
document.getElementById('inGameMenuBtn').addEventListener('click',goToMenu);

function buildSongList(){
  const list=document.getElementById('songList'); list.innerHTML='';
  SONGS.forEach(song=>{
    const btn=document.createElement('button'); btn.className='songBtn';
    const n=song.notes.filter(([l])=>l>=0).length;
    btn.innerHTML=`<strong>${song.title}</strong><span class="meta">${song.bpm} BPM · ${n} notas</span>`;
    btn.addEventListener('click',()=>selectSong(song));
    list.appendChild(btn);
  });
}
function selectSong(song){
  currentSong=song; mode='song'; bpmOverride=null;
  document.getElementById('playTitle').textContent=song.title;
  document.getElementById('playMeta').textContent=`${song.bpm} BPM · ${song.notes.filter(([l])=>l>=0).length} notas`;
  document.getElementById('modeTag').textContent='CANCIÓN';
  document.getElementById('modeTag').className='song';
  document.getElementById('difficultyRow').style.display='flex';
  document.getElementById('bpmRow').style.display='flex';
  updateBpmDisplay(); showScreen('screenPlay');
}
function updateBpmDisplay(){ document.getElementById('bpmValue').textContent=effectiveBpm(); }

document.getElementById('btnFree').addEventListener('click',()=>{
  mode='free';
  document.getElementById('playTitle').textContent='Modo libre';
  document.getElementById('playMeta').textContent='Toca cualquier botón y explora la escala de Fa mayor';
  document.getElementById('modeTag').textContent='LIBRE';
  document.getElementById('modeTag').className='';
  document.getElementById('difficultyRow').style.display='none';
  document.getElementById('bpmRow').style.display='none';
  showScreen('screenPlay');
});
document.getElementById('btnSongs').addEventListener('click',()=>{ buildSongList(); showScreen('screenSongs'); });
document.getElementById('backFromSongs').addEventListener('click',()=>showScreen('screenMenu'));
document.getElementById('backFromPlay').addEventListener('click',()=>mode==='free'?showScreen('screenMenu'):showScreen('screenSongs'));
document.getElementById('backFromEnd').addEventListener('click',()=>showScreen('screenSongs'));
document.getElementById('backToMenuFromEnd').addEventListener('click',goToMenu);
document.getElementById('btnPlayAgain').addEventListener('click',()=>showScreen('screenPlay'));

document.querySelectorAll('.diffBtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    difficulty=btn.dataset.diff;
    document.querySelectorAll('.diffBtn').forEach(b=>b.classList.toggle('active',b===btn));
  });
});
document.querySelector(`.diffBtn[data-diff="${difficulty}"]`).classList.add('active');
document.getElementById('bpmDown').addEventListener('click',()=>{ bpmOverride=Math.max(BPM_MIN,effectiveBpm()-BPM_STEP); updateBpmDisplay(); });
document.getElementById('bpmUp').addEventListener('click',()=>{ bpmOverride=Math.min(BPM_MAX,effectiveBpm()+BPM_STEP); updateBpmDisplay(); });
document.getElementById('bpmReset').addEventListener('click',()=>{ bpmOverride=null; updateBpmDisplay(); });

/* ══════════════════════════════════════════
   INICIO / FIN
══════════════════════════════════════════ */
document.getElementById('startBtn').addEventListener('click',()=>{ initAudio(); startGame(); });

function startGame(){
  score=0; combo=0; hits=0; misses=0; total=0;
  songNoteIdx=0; songDone=false; running=true;
  buildQueue();
  songStartTime=performance.now();
  document.getElementById('hud').style.display=mode==='free'?'none':'flex';
  document.getElementById('inGameMenuBtn').style.display='block';
  document.getElementById('feedbackArea').textContent='\u00a0';
  updateHUD();
  document.getElementById('overlay').style.display='none';
}
function endGame(){
  running=false; stopAllSounds();
  for(let i=0;i<8;i++){
    const r=document.getElementById(`glow-${i}`);
    if(r){r.style.borderColor='transparent';r.style.boxShadow='none';}
  }
  document.getElementById('inGameMenuBtn').style.display='none';
  const acc=total>0?Math.round((hits/total)*100):100;
  document.getElementById('endScore').textContent=`${score} pts`;
  document.getElementById('endAcc').textContent=`precisión ${acc}% · combo máx ${combo}`;
  document.getElementById('overlay').style.display='flex';
  showScreen('screenEnd');
}

/* ══════════════════════════════════════════
   HUD
══════════════════════════════════════════ */
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('comboVal').textContent=combo;
  document.getElementById('acc').textContent=total>0?Math.round((hits/total)*100):100;
}

/* ══════════════════════════════════════════
   INPUT TECLADO
══════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key.toUpperCase();
  const idx=LANES.indexOf(k); if(idx<0) return;
  initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
  keyDown[k]=true;
  domBtns[idx]?.classList.add('pressed');
  tryHit(idx);
});
document.addEventListener('keyup',e=>{
  const k=e.key.toUpperCase();
  const idx=LANES.indexOf(k); if(idx<0) return;
  keyDown[k]=false;
  domBtns[idx]?.classList.remove('pressed');
  stopNote(idx);
});

/* ══════════════════════════════════════════
   LOOP
══════════════════════════════════════════ */
function loop(){ update(); requestAnimationFrame(loop); }

document.getElementById('startBtn').disabled=true;
preloadSamples();
loop();
</script>
