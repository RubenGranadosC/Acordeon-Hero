<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acordeón Hero - La Cucaracha</title>
<style>
  body {
    margin: 0;
    background: #1a1410;
    color: #f2e9dc;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  h1 {
    margin: 12px 0 4px;
    color: #e8b84b;
    text-shadow: 0 0 10px rgba(232,184,75,0.5);
    letter-spacing: 2px;
  }
  #sub { color: #b9a98a; margin-bottom: 8px; font-size: 14px; text-align: center; }
  #gameCanvas {
    background: linear-gradient(180deg, #2a1f18 0%, #1a1410 85%, #0d0906 100%);
    border: 3px solid #e8b84b;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(232,184,75,0.3);
  }
  #hud {
    display: flex;
    gap: 30px;
    margin: 10px 0;
    font-size: 18px;
  }
  #hud span { color: #e8b84b; font-weight: bold; }
  #startBtn { 
    background: #e8b84b;
    color: #1a1410;
    border: none;
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  #startBtn:hover { background: #f5cc6b; }
  #startBtn:disabled {
    background: #6b5f4a;
    color: #b9a98a;
    cursor: not-allowed;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.8);
    text-align: center;
    border-radius: 12px;
  }
  #wrap { position: relative; }
</style>
</head>
<body>
<h1>ACORDEON HERO</h1>
<div id="sub">Escala de Sib mayor (Bb, C, D, Eb) — Melodia: <b>La Cucaracha</b> (<span id="songDuration"></span>)<br>Teclas: <b>D F J K</b></div>
<div id="hud">
  <div>Puntos: <span id="score">0</span></div>
  <div>Combo: <span id="comboVal">0</span></div>
  <div>Precision: <span id="acc">100%</span></div>
</div>
<div id="wrap">
  <canvas id="gameCanvas" width="600" height="500"></canvas>
  <div id="overlay">
    <h2 style="color:#e8b84b;">La Cucaracha</h2>
    <p style="max-width:400px;">Toca las notas Bb, C, D y F con las teclas D F J K<br>al ritmo de la cancion</p>
    <button id="startBtn">Empezar</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Escala de Sib mayor (Bb C D Eb F G A) - usamos 4 grados: Bb(Do) C(Re) D(Mi) Eb(Fa)
const LANES = ['D','F','J','K'];
const NOTE_NAMES = ['Bb','C','D','Eb'];
const LANE_FREQS = [466.16, 523.25, 587.33, 622.25]; // Bb4, C5, D5, Eb5 (no se usa para audio, solo referencia)
const LANE_COLORS = ['#e24b4a', '#ba7517', '#0f6e56', '#378add'];
const LANE_X = LANES.map((_, i) => 60 + i * 150 + 40);
const LANE_W = 90;
const HIT_Y = H - 90;
const NOTE_SPEED = 2.6;
const FPS = 60;
const BPM = 104; // tempo tipico de "La Cucaracha"
const FRAMES_PER_BEAT = FPS * (60 / BPM);

// Duraciones de nota en "beats" (negra = 1, corchea = 0.5, blanca = 2, etc.)
const EIGHTH = 0.5, QUARTER = 1, HALF = 2;

// Melodia de "La Cucaracha" con solfeo movible en Sib mayor (Do=Bb, Re=C, Mi=D, Fa=Eb)
// Cada entrada es [grado, duracion_en_beats]. grado -1 = silencio.
// 0=Bb(Do) 1=C(Re) 2=D(Mi) 3=Eb(Fa)
const SONG = [
  // "La cu-ca-ra-cha, la cu-ca-ra-cha" (frase 1, se repite)
  [2, EIGHTH],[2, EIGHTH],[2, EIGHTH],[2, EIGHTH],   [1, EIGHTH],[2, QUARTER],
  [3, EIGHTH],[3, EIGHTH],[2, EIGHTH],[1, EIGHTH],   [0, HALF],
  [2, EIGHTH],[2, EIGHTH],[2, EIGHTH],[2, EIGHTH],   [1, EIGHTH],[2, QUARTER],
  [3, EIGHTH],[3, EIGHTH],[2, EIGHTH],[1, EIGHTH],   [0, HALF],
  // "ya no puede caminar" (frase 2)
  [0, EIGHTH],[0, EIGHTH],[0, EIGHTH],[0, EIGHTH],   [1, EIGHTH],[0, QUARTER],
  [3, EIGHTH],[2, EIGHTH],[1, EIGHTH],[0, HALF],
  [-1, QUARTER],
  // repite frase 2 para cerrar
  [0, EIGHTH],[0, EIGHTH],[0, EIGHTH],[0, EIGHTH],   [1, EIGHTH],[0, QUARTER],
  [3, EIGHTH],[2, EIGHTH],[1, EIGHTH],[0, HALF],
  [-1, HALF]
];

const SONG_TOTAL_BEATS = SONG.reduce((sum, [, dur]) => sum + dur, 0);
const SONG_DURATION_SEC = SONG_TOTAL_BEATS * (60 / BPM);

let notes = [];
let particles = [];
let score = 0, combo = 0, hits = 0, total = 0;
let spawnTimer = 0;
let nextSpawnGap = 0;
let songIndex = 0;
let running = false;
const laneKeyState = {D:false,F:false,J:false,K:false};

// ===== Sistema de audio de baja latencia (Web Audio API) =====
// Los samples ya vienen en WAV, sin silencio inicial (recortados de antemano).
// El sample de cada carril se determina por el NOMBRE de la nota en NOTE_NAMES
// (ej. NOTE_NAMES[0] = 'Bb' -> carga sounds/Bb.wav).
const SAMPLE_FILES = NOTE_NAMES.map(note => `sounds/${note}.wav`);
const audioBuffers = [null, null, null, null];
const activeSources = [null, null, null, null]; // fuente activa por carril, para loop/stop
let audioCtx = null;
let samplesReady = false;
let audioUnlocked = false;

function initAudioContext() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
}

// Carga y decodifica los 4 WAV UNA sola vez, antes de que se pueda jugar.
// No hay fetch ni decodeAudioData en ningun otro lugar del codigo.
async function preloadSamples() {
  initAudioContext();
  const loadOne = async (src, i) => {
    const res = await fetch(src);
    const arrBuf = await res.arrayBuffer();
    audioBuffers[i] = await audioCtx.decodeAudioData(arrBuf);
    console.log(`[audio] precargado y decodificado: ${src}`);
  };
  await Promise.all(SAMPLE_FILES.map(loadOne));
  samplesReady = true;
  onSamplesReady();
}

function unlockAudioOnce() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  initAudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  window.removeEventListener('pointerdown', unlockAudioOnce);
  window.removeEventListener('keydown', unlockAudioOnce);
}
window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
window.addEventListener('keydown', unlockAudioOnce, { once: true });

// Reproduccion: SOLO crea un BufferSource desde el buffer ya en memoria
// y lo arranca. Nada de fetch, decode, setTimeout, promesas ni RAF entre
// el keydown y el start(0) -- todo es sincrono.
function playNote(laneIdx, missSound, t0) {
  const file = SAMPLE_FILES[laneIdx];
  if (!audioCtx || !audioBuffers[laneIdx]) {
    console.warn(`[audio] buffer no listo todavia para ${file}`);
    return;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // si ya habia una nota sonando en este carril, la cortamos primero
  stopNote(laneIdx);

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuffers[laneIdx];
  src.loop = true; // se repite mientras la tecla siga presionada
  const gain = audioCtx.createGain();
  gain.gain.value = missSound ? 0.35 : 1;
  src.playbackRate.value = missSound ? 0.85 : 1;
  src.connect(gain);
  gain.connect(audioCtx.destination);
  src.start(0);
  activeSources[laneIdx] = { src, gain };
  if (t0 !== undefined) {
    console.log(`[audio] reproduciendo ${file} | latencia keydown->start: ${(performance.now() - t0).toFixed(2)} ms`);
  } else {
    console.log(`[audio] reproduciendo ${file}`);
  }
}

// Corta la nota que este sonando en un carril (con un fade corto para
// evitar el "click" de cortar el audio abruptamente).
function stopNote(laneIdx) {
  const active = activeSources[laneIdx];
  if (!active) return;
  const { src, gain } = active;
  const now = audioCtx.currentTime;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(gain.gain.value, now);
  gain.gain.linearRampToValueAtTime(0, now + 0.03);
  src.stop(now + 0.03);
  activeSources[laneIdx] = null;
}

function spawnFromSong() {
  const [lane] = SONG[songIndex % SONG.length];
  songIndex++;
  if (lane >= 0) {
    notes.push({ lane, y: -20, hit: false, missed: false });
  }
}

function currentNoteFrames() {
  // frames que dura la nota actual de la cancion, segun su valor ritmico
  const [, beats] = SONG[songIndex % SONG.length];
  return Math.round(beats * FRAMES_PER_BEAT);
}

function addParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y, color,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1
    });
  }
}

function update() {
  if (!running) return;

  spawnTimer++;
  if (spawnTimer > nextSpawnGap) {
    spawnTimer = 0;
    nextSpawnGap = currentNoteFrames();
    spawnFromSong();
  }

  notes.forEach(n => {
    if (!n.hit && !n.missed) {
      n.y += NOTE_SPEED;
      if (n.y > HIT_Y + 40) {
        n.missed = true;
        combo = 0;
        total++;
      }
    }
  });
  notes = notes.filter(n => n.y < H + 30);

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.03; });
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < 4; i++) {
    const x = LANE_X[i] - LANE_W/2;
    ctx.fillStyle = laneKeyState[LANES[i]] ? LANE_COLORS[i] + '33' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(x, 0, LANE_W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeRect(x, 0, LANE_W, H);

    ctx.fillStyle = LANE_COLORS[i];
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(NOTE_NAMES[i], LANE_X[i], 24);
  }

  ctx.strokeStyle = '#e8b84b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(20, HIT_Y);
  ctx.lineTo(W - 20, HIT_Y);
  ctx.stroke();

  for (let i = 0; i < 4; i++) {
    const x = LANE_X[i];
    ctx.beginPath();
    ctx.arc(x, HIT_Y, 28, 0, Math.PI * 2);
    ctx.fillStyle = laneKeyState[LANES[i]] ? LANE_COLORS[i] : '#2a2a2a';
    ctx.fill();
    ctx.strokeStyle = LANE_COLORS[i];
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(LANES[i], x, HIT_Y);
    ctx.font = '11px Arial';
    ctx.fillStyle = '#b9a98a';
    ctx.fillText(NOTE_NAMES[i], x, HIT_Y + 42);
  }

  notes.forEach(n => {
    if (n.hit) return;
    const x = LANE_X[n.lane];
    ctx.beginPath();
    ctx.arc(x, n.y, 22, 0, Math.PI * 2);
    ctx.fillStyle = n.missed ? '#444' : LANE_COLORS[n.lane];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(NOTE_NAMES[n.lane], x, n.y);
  });

  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  if (running && songIndex >= SONG.length && notes.length === 0) {
    ctx.fillStyle = '#e8b84b';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('¡Cancion terminada!', W/2, H/2);
    running = false;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function tryHit(laneIdx, t0) {
  if (!running) return;
  let best = null, bestDist = 9999;
  notes.forEach(n => {
    if (n.lane === laneIdx && !n.hit && !n.missed) {
      const d = Math.abs(n.y - HIT_Y);
      if (d < bestDist) { bestDist = d; best = n; }
    }
  });

  if (best && bestDist < 45) {
    best.hit = true;
    total++;
    hits++;
    combo++;
    const pts = bestDist < 15 ? 100 : 50;
    score += pts + Math.floor(combo / 5) * 5;
    addParticles(LANE_X[laneIdx], HIT_Y, LANE_COLORS[laneIdx]);
    playNote(laneIdx, false, t0);
  } else {
    combo = 0;
    playNote(laneIdx, true, t0);
  }
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('comboVal').textContent = combo;
  const acc = total > 0 ? Math.round((hits/total)*100) : 100;
  document.getElementById('acc').textContent = acc + '%';
}

document.addEventListener('keydown', (e) => {
  const t0 = performance.now(); // medicion de latencia: arranca justo en el evento
  const k = e.key.toUpperCase();
  if (LANES.includes(k)) {
    if (!laneKeyState[k]) {
      laneKeyState[k] = true;
      tryHit(LANES.indexOf(k), t0);
    }
  }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toUpperCase();
  if (LANES.includes(k)) {
    laneKeyState[k] = false;
    stopNote(LANES.indexOf(k));
  }
});

document.getElementById('startBtn').addEventListener('click', () => {
  if (!samplesReady) return; // por seguridad, no debería poder pulsarse antes
  unlockAudioOnce();
  document.getElementById('overlay').style.display = 'none';
  running = true;
  notes = []; particles = []; score = 0; combo = 0; hits = 0; total = 0;
  spawnTimer = 0; songIndex = 0; nextSpawnGap = currentNoteFrames();
  updateHUD();
});

// 7) Indicador "Cargando sonidos..." -- el boton arranca deshabilitado
//    y solo se habilita cuando los 4 samples ya estan decodificados.
function onSamplesReady() {
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = 'Empezar';
}

const startBtn = document.getElementById('startBtn');
startBtn.disabled = true;
startBtn.textContent = 'Cargando sonidos...';
preloadSamples();
document.getElementById('songDuration').textContent = `${SONG_DURATION_SEC.toFixed(1)}s a ${BPM} BPM`;

loop();
</script>
</body>
</html>
